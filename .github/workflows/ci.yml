name: QA Automation CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build-and-test:

        runs-on: ubuntu-latest

        steps:

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Cache Maven dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.m2
                  key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
                  restore-keys: |
                      maven-${{ runner.os }}

            - name: Build project
              run: mvn clean install -DskipTests

            # ✅ Run API tests (safe for CI)
            - name: Run API Tests
              run: mvn -pl api-automation test

            # ❗ UI tests (headless)
            - name: Run UI Tests (Headless)
              run: mvn -pl ui-automation test -Dheadless=true